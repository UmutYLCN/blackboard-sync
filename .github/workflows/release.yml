name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the app version
        run: |
          VERSION="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/blackboard_sync/__init__.py)"
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $VERSION" >&2; exit 1; }
      - name: Build the app and .dmg
        run: |
          ./scripts/setup.sh
          .venv/bin/python -m pytest -q
          ./scripts/build-app.sh
      # The app's updater (src/blackboard_sync/updater.py) finds installers by
      # name, so keep these exact: macOS "Blackboard-Sync-<version>.dmg",
      # Windows "Blackboard-Sync-<version>-Setup.exe". It refuses an installer
      # that SHA256SUMS.txt does not list or that does not match its line, so
      # a job adding another installer must also append its line, e.g.
      #   gh release download "$TAG" -p SHA256SUMS.txt
      #   sha256sum Blackboard-Sync-<version>-Setup.exe >> SHA256SUMS.txt
      #   gh release upload "$TAG" Blackboard-Sync-<version>-Setup.exe SHA256SUMS.txt --clobber
      - name: Write SHA256SUMS.txt
        working-directory: dist
        run: shasum -a 256 Blackboard-Sync-*.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Blackboard-Sync-*.dmg dist/SHA256SUMS.txt --title "$GITHUB_REF_NAME" --generate-notes
