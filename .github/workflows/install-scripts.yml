name: Install scripts

# Runs the macOS one-line installer against the latest public release.
on:
  pull_request:
    paths:
      - install.sh
      - .github/workflows/install-scripts.yml
  push:
    branches: [main]
    paths:
      - install.sh
      - .github/workflows/install-scripts.yml
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: shellcheck install.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run install.sh
        run: sh install.sh
      - name: Assert the app is installed
        run: |
          test -d "/Applications/Blackboard Sync.app" || test -d "$HOME/Applications/Blackboard Sync.app"
          app="/Applications/Blackboard Sync.app"; [ -d "$app" ] || app="$HOME/Applications/Blackboard Sync.app"
          test -x "$app/Contents/MacOS/Blackboard Sync"
          if xattr "$app" | grep -q com.apple.quarantine; then echo "quarantine flag still set"; exit 1; fi
          if mount | grep -q blackboard-sync; then echo "disk image still mounted"; exit 1; fi
