name: Microsoft Store package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msix:
    # Production OAuth metadata is only available to an explicit build of main.
    # Pull requests continue using the secret-free package job in ci.yml.
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build the submission package
        env:
          BBSYNC_GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_CALENDAR_OAUTH_CLIENT_JSON }}
          BBSYNC_REQUIRE_GOOGLE_OAUTH: "1"
        run: ./scripts/build-msix.ps1
      - name: Check bundled Google Calendar configuration
        run: '& "dist/Blackboard Sync/blackboard-sync-cli.exe" --check-google-calendar'
      - name: Test the installed package, including Google Calendar configuration
        shell: powershell
        run: ./scripts/smoke-test-msix.ps1 -RequireGoogleCalendar
      - name: Record package checksum and source
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem dist/Blackboard-Sync-*-x64.msix)
          if ($packages.Count -ne 1) { throw "Expected exactly one Store package" }
          $msix = $packages[0]
          $hash = (Get-FileHash $msix.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($msix.Name)" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          "Source commit: $env:GITHUB_SHA`nWorkflow run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`nUnsigned package: Microsoft Store signs the published package." | Set-Content dist/BUILD.txt -Encoding utf8
      # Upload only after the installed-package checks pass. No certificates,
      # private build directory or user tokens are included in this artifact.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: microsoft-store
          path: |
            dist/Blackboard-Sync-*-x64.msix
            dist/SHA256SUMS.txt
            dist/BUILD.txt
          if-no-files-found: error
