name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      # Both sign-in methods can load what they need: the Playwright driver and
      # the in-app window's web component (WKWebView / WebView2).
      - run: python packaging/app_entry.py --check-login-runtime
      # Windows' default is no long paths (MAX_PATH = 260). Switch them off for a
      # new process and sync a deep course tree into a real folder (audit B9).
      - name: Deep folders without long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ItemProperty -Path HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem -Name LongPathsEnabled -Value 0
          $env:BBSYNC_TEST_MAX_PATH = "1"
          python -m pytest -q tests/test_windows_long_paths.py -k "real_windows or enforces_max_path"
