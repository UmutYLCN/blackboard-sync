name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      # Both sign-in methods can load what they need: the Playwright driver and
      # the in-app window's web component (WKWebView / WebView2).
      - run: python packaging/app_entry.py --check-login-runtime
      - run: python packaging/app_entry.py --check-note-pdf
      # Windows' default is no long paths (MAX_PATH = 260). Switch them off for a
      # new process and sync a deep course tree into a real folder (audit B9).
      - name: Deep folders without long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ItemProperty -Path HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem -Name LongPathsEnabled -Value 0
          $env:BBSYNC_TEST_MAX_PATH = "1"
          python -m pytest -q tests/test_windows_long_paths.py -k "real_windows or enforces_max_path"

  # The Microsoft Store package (docs/MSIX.md): built unsigned and kept as a
  # workflow artifact only; nothing is signed for real, released or submitted.
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build the .msix
        run: ./scripts/build-msix.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msix
          path: dist/Blackboard-Sync-*-x64.msix
          if-no-files-found: error
      # Sideloads a test-signed copy, runs the self-tests inside the package and
      # starts the app, then removes it. Windows PowerShell: it has the Appx module.
      - name: Smoke-test the package
        shell: powershell
        run: ./scripts/smoke-test-msix.ps1
