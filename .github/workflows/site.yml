name: Website

on:
  pull_request:
    paths: ["site/**", ".github/workflows/site.yml"]
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install browser test tools
        run: |
          python -m pip install pytest==9.1.1 playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Start the local Cloudflare asset server
        working-directory: site
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx --yes wrangler@4.149.0 dev --port 8792 --persist-to "$RUNNER_TEMP/site-state" > "$RUNNER_TEMP/site-server.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8792/tr/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/site-server.log"
          exit 1
      - name: Check language navigation, downloads and responsive layouts
        env:
          SITE_SCREENSHOT_DIR: ${{ runner.temp }}/site-screenshots
        run: python -m pytest -q site/tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: website-screenshots
          path: ${{ runner.temp }}/site-screenshots
          if-no-files-found: ignore
