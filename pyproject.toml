[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blackboard-sync"
dynamic = ["version"]
description = "Mirror Blackboard Learn Ultra course content into local folders."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "Send2Trash==2.1.0",
    "pywin32==312; sys_platform == 'win32'",
    "pystray==0.19.5; sys_platform == 'win32'",
    "Pillow==11.3.0; sys_platform == 'win32'",
    "requests==2.34.2",
    "playwright==1.63.0",
    # The macOS menu bar app only; the core and CLI never import them.
    "rumps==0.4.0; sys_platform == 'darwin'",
    "pyobjc-core==12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa==12.2.2; sys_platform == 'darwin'",
    # The in-app sign-in window (used when no supported browser is installed):
    # WKWebView on macOS, Microsoft Edge WebView2 through pywebview on Windows.
    "pyobjc-framework-WebKit==12.2.2; sys_platform == 'darwin'",
    "pywebview==6.2.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
blackboard-sync = "blackboard_sync.cli:main"
blackboard-sync-tray = "blackboard_sync.windows.app:main"
blackboard-sync-menubar = "blackboard_sync.menubar.app:main"

[tool.setuptools.dynamic]
version = {attr = "blackboard_sync.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
