[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blackboard-sync"
dynamic = ["version"]
description = "Mirror Blackboard Learn Ultra course content into local folders."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "requests==2.34.2",
    "playwright==1.63.0",
    "rumps==0.4.0",
    "pyobjc-core==12.2.2",
    "pyobjc-framework-Cocoa==12.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
blackboard-sync = "blackboard_sync.cli:main"
blackboard-sync-menubar = "blackboard_sync.menubar.app:main"

[tool.setuptools.dynamic]
version = {attr = "blackboard_sync.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
