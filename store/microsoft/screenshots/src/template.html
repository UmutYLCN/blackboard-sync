<!doctype html>
<!-- One Microsoft Store screenshot, 1920x1080. render.sh opens it in headless
     Chrome as template.html?shot=<id>&img=<app capture>&lang=tr&draft=1 and
     saves a PNG. Capture styling follows site/styles.css; the text-only card
     adapts the promo video scene.html typography and gradients to 16:9. -->
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Store screenshot</title>
<style>
  :root {
    --bg: #0b1425;
    --text: #f4f7fc;
    --muted: #a9b8cd;
    --cyan: #50ddf4;
    --line: #26354a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    font-synthesis: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse at 78% 17%, #12345380, transparent 35%),
      radial-gradient(ellipse at 5% 0%, #182e514d, transparent 30%),
      radial-gradient(ellipse at 50% 120%, #10303a99, transparent 55%),
      var(--bg);
    color: var(--text);
    position: relative;
  }
  h1 {
    position: absolute;
    top: 78px;
    left: 0;
    right: 0;
    margin: 0;
    text-align: center;
    font-size: 84px;
    line-height: 1.05;
    font-weight: 750;
    letter-spacing: -1.5px;
  }
  h1 span {
    background: linear-gradient(100deg, #68e8ec, #3d98ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  /* Promo scene.html: navy radial background, cyan glow and .cap/.hl type.
     Re-laid out for 1920x1080; no video frame, logo or platform UI is embedded. */
  body.promo {
    background: radial-gradient(1700px 1100px at 20% 15%, #1a2c55 0%, #111a30 45%, #0b1120 100%);
    color: #fff;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Inter, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body.promo::before {
    content: "";
    position: absolute;
    left: 600px;
    top: 80px;
    width: 900px;
    height: 900px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(34,211,238,.18), transparent 60%);
    filter: blur(10px);
  }
  .promo h1 {
    top: 290px;
    left: 120px;
    right: 120px;
    font-size: 116px;
    font-weight: 800;
    line-height: 1.08;
    white-space: pre-line;
  }
  .promo h1 span { background-image: linear-gradient(90deg, #22d3ee, #3b82f6); }
  .promo .subtitle {
    position: absolute;
    top: 620px;
    left: 120px;
    right: 120px;
    margin: 0;
    text-align: center;
    font-size: 54px;
    font-weight: 500;
    color: #a9b8d6;
  }
  .stage {
    position: absolute;
    top: 236px;
    bottom: 36px;
    left: 110px;
    right: 110px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }
  /* Keep small tray captures at native size, centred below the title. */
  .stage.compact { align-items: center; bottom: 236px; }
  .stage img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 30px 60px #000000a0);
  }
  .placeholder {
    width: 1400px;
    height: 760px;
    border: 4px dashed #3d98ff;
    border-radius: 28px;
    background: #10203a99;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 22px;
    text-align: center;
    padding: 60px;
  }
  .placeholder strong { font-size: 52px; letter-spacing: -1px; }
  .placeholder p { margin: 0; font-size: 34px; color: var(--muted); max-width: 1100px; }
  .draft {
    position: absolute;
    top: 22px;
    left: 22px;
    padding: 10px 20px;
    border-radius: 999px;
    background: #f5a524;
    color: #1b1300;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: .3px;
  }
</style>
</head>
<body>
<h1 id="title"></h1>
<div class="stage" id="stage"></div>
<script src="shots.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const lang = params.get("lang") || "tr";
  const shot = SHOTS.find(s => s.id === params.get("shot")) || SHOTS[0];
  const [plain, highlight, suffix = ""] = shot.title[lang];
  const title = document.getElementById("title");
  title.append(plain);
  const span = document.createElement("span");
  span.textContent = highlight;
  title.append(span, suffix);
  document.documentElement.lang = lang;

  const stage = document.getElementById("stage");
  stage.classList.toggle("compact", !!shot.compact);
  const img = params.get("img");
  if (shot.kind === "card") {
    document.body.classList.add("promo");
    stage.remove();
    const subtitle = document.createElement("p");
    subtitle.className = "subtitle";
    subtitle.textContent = shot.subtitle[lang];
    document.body.append(subtitle);
  } else if (img) {
    const el = document.createElement("img");
    el.src = img;
    el.alt = "";
    stage.append(el);
  } else {
    stage.innerHTML = '<div class="placeholder"><strong>Windows capture needed</strong><p></p></div>';
    stage.querySelector("p").textContent = shot.capture;
  }
  if (params.get("draft") === "1") {
    const tag = document.createElement("div");
    tag.className = "draft";
    tag.textContent = img ? "DRAFT · macOS capture · do not upload to the Store" : "DRAFT · do not upload to the Store";
    document.body.append(tag);
  }
</script>
</body>
</html>
