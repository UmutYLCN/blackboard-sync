<!doctype html>
<!-- Store poster (1440x2160) and box art (2160x2160): logo and app name only.
     ../make-images.sh renders both sizes. Background follows hero-art.html. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>blackboard-sync</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    background:
      radial-gradient(circle at 50% 38%, #1f6fb266, transparent 26%),
      radial-gradient(ellipse at 22% 20%, #12345399, transparent 40%),
      radial-gradient(ellipse at 80% 30%, #10303acc, transparent 42%),
      linear-gradient(180deg, #0d1a30, #0b1425 70%);
    position: relative;
  }
  .ring {
    position: absolute;
    left: 50%;
    top: 42%;
    border-radius: 50%;
    border: 2px solid #50ddf41f;
    transform: translate(-50%, -50%);
  }
  img {
    position: absolute;
    left: 50%;
    top: 42%;
    width: 760px;
    height: 760px;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 30px 60px #000000a0);
  }
  h1 {
    position: absolute;
    top: 64%;
    width: 100%;
    margin: 0;
    color: #f4f7fc;
    font: 600 112px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    letter-spacing: -3px;
    text-align: center;
    white-space: nowrap;
  }
  @media (min-aspect-ratio: 1/1) {
    h1 { font-size: 144px; }
  }
</style>
</head>
<body>
  <div class="ring" style="width:1000px;height:1000px"></div>
  <div class="ring" style="width:1320px;height:1320px;border-color:#50ddf414"></div>
  <div class="ring" style="width:1640px;height:1640px;border-color:#50ddf40d"></div>
  <img src="../../../../assets/icon/logo.png" alt="">
  <h1>blackboard-sync</h1>
</body>
</html>
